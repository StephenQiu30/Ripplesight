# Local development is loaded automatically by `docker compose up`.
# Production and CI select their Compose files explicitly.
services:
  backend:
    command:
      - /srv/backend/.venv/bin/uvicorn
      - main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-proxy-headers
      - --no-access-log
      - --reload
      - --reload-dir
      - /srv/backend/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/srv/backend/app:ro

  frontend:
    build:
      target: development
    image: ripplesight-frontend:dev
    read_only: false
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NODE_OPTIONS: "--max-old-space-size=1536"
    tmpfs: !override
      - /tmp
    volumes:
      - frontend_dev_cache:/app/.next
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/next.config.ts:/app/next.config.ts:ro
      - ./frontend/env.config.mjs:/app/env.config.mjs:ro
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G

  workspace:
    build:
      target: development
    image: ripplesight-workspace:dev
    read_only: false
    volumes:
      - .:/source:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/Ripplesight/"]
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

volumes:
  frontend_dev_cache:
