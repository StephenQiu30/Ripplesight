server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /Ripplesight/;
    }

    location = /Ripplesight {
        return 308 /Ripplesight/;
    }

    location /Ripplesight/raw/ {
        types { text/markdown md; }
        try_files $uri =404;
    }

    location /Ripplesight/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /Ripplesight/404.html;

    location = /Ripplesight/404.html {
        internal;
    }

    location / {
        return 404;
    }
}
