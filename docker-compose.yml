  HOTKEY_AUTH_SMTP_FROM_EMAIL: ${HOTKEY_AUTH_SMTP_FROM_EMAIL:-}
  HOTKEY_EMAIL_CODE_HMAC_KEY: ${HOTKEY_EMAIL_CODE_HMAC_KEY:-}
  HOTKEY_PUBLIC_CONTACT_OWNER_ID: ${HOTKEY_PUBLIC_CONTACT_OWNER_ID:-}
  HOTKEY_PUBLIC_PUBLICATION_OWNER_ID: ${HOTKEY_PUBLIC_PUBLICATION_OWNER_ID:-}

  # Shared root configuration for API, Worker and CLI.
  HOTKEY_LOG_LEVEL: ${HOTKEY_LOG_LEVEL:-INFO}
  HOTKEY_KAFKA_GROUP_ID: ${HOTKEY_KAFKA_GROUP_ID:-hotkey-worker}
  HOTKEY_KAFKA_DELIVERY_TIMEOUT_SECONDS: ${HOTKEY_KAFKA_DELIVERY_TIMEOUT_SECONDS:-10}
  HOTKEY_JOB_LEASE_SECONDS: ${HOTKEY_JOB_LEASE_SECONDS:-75}
  HOTKEY_JOB_MAX_CATCHUP_WINDOWS: ${HOTKEY_JOB_MAX_CATCHUP_WINDOWS:-3}
  HOTKEY_BROWSER_CONNECT_TIMEOUT_SECONDS: ${HOTKEY_BROWSER_CONNECT_TIMEOUT_SECONDS:-5}
  HOTKEY_BROWSER_EXECUTION_TIMEOUT_SECONDS: ${HOTKEY_BROWSER_EXECUTION_TIMEOUT_SECONDS:-45}
  HOTKEY_BROWSER_STATE_DIR: ${HOTKEY_BROWSER_STATE_DIR:-}
  HOTKEY_AI_ENABLED: ${HOTKEY_AI_ENABLED:-false}
  HOTKEY_EVENTS_CLUSTER_ENABLED: ${HOTKEY_EVENTS_CLUSTER_ENABLED:-false}
  HOTKEY_EDITORIAL_SOURCES_ENABLED: ${HOTKEY_EDITORIAL_SOURCES_ENABLED:-false}
  HOTKEY_EDITORIAL_PUBLIC_REQUESTS_ENABLED: ${HOTKEY_EDITORIAL_PUBLIC_REQUESTS_ENABLED:-false}
