  HOTKEY_NOTIFICATION_SMTP_FROM_EMAIL: ${HOTKEY_NOTIFICATION_SMTP_FROM_EMAIL:-}

x-backend-service: &backend-service
  build:
    context: ./backend
  image: ${HOTKEY_BACKEND_IMAGE:-hotkey-backend:local}
  environment: *backend-environment
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true
  read_only: true
  tmpfs:
    - /tmp

services:
  backend:
    <<: *backend-service
    ports:
      - 127.0.0.1:${HOTKEY_API_PORT:-8667}:8080
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  frontend:
    build:
      context: ./frontend
    image: ${HOTKEY_FRONTEND_IMAGE:-hotkey-frontend:local}
    environment:
      HOTKEY_API_ORIGIN: http://backend:8080
      HOTKEY_WEB_ORIGIN: ${HOTKEY_WEB_ORIGIN:-http://127.0.0.1:8666}
    depends_on:
      backend:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /app/.next/cache
      - /tmp
    ports:
      - 127.0.0.1:${HOTKEY_WEB_PORT:-8666}:8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M

  worker:
    <<: *backend-service
    command: ["/srv/backend/.venv/bin/python", "-m", "worker"]
    restart: unless-stopped
    profiles: ["worker"]
    networks:
      - default
      - browser-internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  browser:
    build:
      context: ./backend
      target: browser
    image: ${HOTKEY_BROWSER_IMAGE:-hotkey-browser:local}
    environment:
      HOTKEY_BROWSER_WS_URL: ${HOTKEY_BROWSER_WS_URL:-}
    init: true
    user: pwuser
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
      - /home/pwuser:rw,nosuid,size=64m
    shm_size: 512m
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp:./backend/browser/seccomp.json
    depends_on:
      browser-egress:
        condition: service_healthy
    networks:
      - browser-internal
      - browser-egress-internal
    profiles: ["browser"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',function(){this.end()}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
          pids: 256

  browser-egress:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    user: "13:13"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/log/squid:rw,nosuid,size=4m,uid=13,gid=13,mode=0700
      - /var/spool/squid:rw,nosuid,size=4m,uid=13,gid=13,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    volumes:
      - type: bind
        source: ./backend/browser/squid.conf
        target: /etc/squid/squid.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - browser-egress-internal
      - browser-uplink
    profiles: ["browser"]
    healthcheck:
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 64

  cli:
    <<: *backend-service
    entrypoint: ["/srv/backend/.venv/bin/python", "-m", "cli"]
    command: ["--help"]
    profiles: ["cli"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  browser-internal:
    internal: true
  browser-egress-internal:
    internal: true
  browser-uplink:
