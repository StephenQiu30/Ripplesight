  HOTKEY_EDITORIAL_INGRESS_HMAC_SECRET: ${HOTKEY_EDITORIAL_INGRESS_HMAC_SECRET:-}
  HOTKEY_EDITORIAL_PAID_CAPS_CNY_MICROS: '${HOTKEY_EDITORIAL_PAID_CAPS_CNY_MICROS:-{}}'
  HOTKEY_PUBLICATION_UPDATES_ENABLED: ${HOTKEY_PUBLICATION_UPDATES_ENABLED:-true}
  HOTKEY_MEDIA_MIRROR_ENABLED: ${HOTKEY_MEDIA_MIRROR_ENABLED:-false}
  HOTKEY_MEDIA_MIRROR_ALLOW_EXTERNAL_REQUESTS: ${HOTKEY_MEDIA_MIRROR_ALLOW_EXTERNAL_REQUESTS:-false}
  HOTKEY_MEDIA_MIRROR_IMAGE_MAX_BYTES: ${HOTKEY_MEDIA_MIRROR_IMAGE_MAX_BYTES:-15728640}
  HOTKEY_MEDIA_MIRROR_VIDEO_MAX_BYTES: ${HOTKEY_MEDIA_MIRROR_VIDEO_MAX_BYTES:-67108864}
  HOTKEY_MEDIA_MIRROR_REDIRECT_HOSTS: '${HOTKEY_MEDIA_MIRROR_REDIRECT_HOSTS:-[]}'
  HOTKEY_SELECTBENCH_ENABLED: ${HOTKEY_SELECTBENCH_ENABLED:-false}
  HOTKEY_PUBLICATION_INDEXING_ENABLED: ${HOTKEY_PUBLICATION_INDEXING_ENABLED:-false}
  HOTKEY_INDEXNOW_ENABLED: ${HOTKEY_INDEXNOW_ENABLED:-false}
