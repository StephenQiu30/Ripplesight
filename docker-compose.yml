  HOTKEY_SOURCE_ICONS_ENABLED: ${HOTKEY_SOURCE_ICONS_ENABLED:-false}
  HOTKEY_SOURCE_ICONS_EXTERNAL_REQUESTS_ENABLED: ${HOTKEY_SOURCE_ICONS_EXTERNAL_REQUESTS_ENABLED:-false}
  HOTKEY_EMBEDDINGS_ENABLED: ${HOTKEY_EMBEDDINGS_ENABLED:-false}
