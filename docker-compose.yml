  HOTKEY_EMBEDDING_CURRENCY: ${HOTKEY_EMBEDDING_CURRENCY:-}
  HOTKEY_EMBEDDING_INPUT_RATE_MICROS_PER_MILLION: ${HOTKEY_EMBEDDING_INPUT_RATE_MICROS_PER_MILLION:-}
  HOTKEY_REPORT_EDITIONS_ENABLED: ${HOTKEY_REPORT_EDITIONS_ENABLED:-false}
  HOTKEY_LEADERBOARD_ENABLED: ${HOTKEY_LEADERBOARD_ENABLED:-false}
  HOTKEY_LEADERBOARD_EXTERNAL_REQUESTS_ENABLED: ${HOTKEY_LEADERBOARD_EXTERNAL_REQUESTS_ENABLED:-false}
  HOTKEY_CODEX_RESETS_ENABLED: ${HOTKEY_CODEX_RESETS_ENABLED:-false}
  HOTKEY_OPERATIONS_MAINTENANCE_ENABLED: ${HOTKEY_OPERATIONS_MAINTENANCE_ENABLED:-false}
  HOTKEY_OPERATIONS_QUIET_MINUTES: ${HOTKEY_OPERATIONS_QUIET_MINUTES:-360}
  HOTKEY_OPERATIONS_STARTUP_GRACE_MINUTES: ${HOTKEY_OPERATIONS_STARTUP_GRACE_MINUTES:-20}
  HOTKEY_OPERATIONS_ALERTS_ENABLED: ${HOTKEY_OPERATIONS_ALERTS_ENABLED:-false}
  HOTKEY_FEEDBACK_FORWARD_ENABLED: ${HOTKEY_FEEDBACK_FORWARD_ENABLED:-false}
  HOTKEY_NOTIFICATIONS_ENABLED: ${HOTKEY_NOTIFICATIONS_ENABLED:-false}
  HOTKEY_NOTIFICATION_SMTP_ENABLED: ${HOTKEY_NOTIFICATION_SMTP_ENABLED:-false}
  HOTKEY_NOTIFICATION_SMTP_PORT: ${HOTKEY_NOTIFICATION_SMTP_PORT:-587}
  HOTKEY_NOTIFICATION_SMTP_TLS: ${HOTKEY_NOTIFICATION_SMTP_TLS:-starttls}
  HOTKEY_NOTIFICATION_SMTP_TIMEOUT_SECONDS: ${HOTKEY_NOTIFICATION_SMTP_TIMEOUT_SECONDS:-10}
  HOTKEY_AI_MODEL_CATALOG: '${HOTKEY_AI_MODEL_CATALOG:-{}}'
  HOTKEY_AI_CAPABILITY_MODELS: '${HOTKEY_AI_CAPABILITY_MODELS:-{}}'
  HOTKEY_AI_PAID_REQUESTS_ENABLED: ${HOTKEY_AI_PAID_REQUESTS_ENABLED:-false}
  HOTKEY_AI_VISION_REQUESTS_ENABLED: ${HOTKEY_AI_VISION_REQUESTS_ENABLED:-false}
  HOTKEY_AI_OPENAI_COMPATIBLE_REQUESTS_ENABLED: ${HOTKEY_AI_OPENAI_COMPATIBLE_REQUESTS_ENABLED:-false}

  HOTKEY_EMBEDDING_API_KEY: ${HOTKEY_EMBEDDING_API_KEY:-}
