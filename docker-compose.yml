  HOTKEY_NOTIFICATION_SMTP_HOST: ${HOTKEY_NOTIFICATION_SMTP_HOST:-}
  HOTKEY_NOTIFICATION_SMTP_USERNAME: ${HOTKEY_NOTIFICATION_SMTP_USERNAME:-}
