name: docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'frontend/tests/docs/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'BACKLOG.md'
      - 'PROJECT.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'frontend/tests/docs/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'BACKLOG.md'
      - 'PROJECT.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:index
      - run: git diff --exit-code -- ../docs/index.md
      - run: pnpm docs:check
      - run: pnpm test tests/docs/documents.test.ts
