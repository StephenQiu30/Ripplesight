name: runtime

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/runtime.yml"

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOTKEY_API_PORT: "8867"
      HOTKEY_POSTGRES_PASSWORD: runtime_ci_only
      HOTKEY_DATABASE_URL: postgresql+psycopg://hotkey:runtime_ci_only@postgres:5432/hotkey
      HOTKEY_REDIS_URL: redis://redis:6379/0
      HOTKEY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HOTKEY_WEB_PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify application parity and infrastructure separation
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          environment = {key: value for key, value in os.environ.items() if not key.startswith(("HOTKEY_", "COMPOSE_"))}
          def config(path, env_file):
              selected_environment = dict(environment, HOTKEY_COMPOSE_ENV_FILE=str(env_file))
              result = subprocess.check_output(
                  ["docker", "compose", "--project-name", "hotkey-parity", "--env-file", str(env_file), "-f", path,
                   "--profile", "*", "config", "--format", "json"], env=selected_environment, text=True
              )
              return json.loads(result)

          with tempfile.TemporaryDirectory() as directory:
              development = Path(directory) / "development.env"
              production = Path(directory) / "production.env"
              template = Path(".env.example").read_text()
              development.write_text(template)
              production.write_text(template.replace("CHANGE_ME_URL_SAFE", "production_test_only"))
              local = config("docker-compose.yml", development)
              prod = config("docker-compose-prod.yml", production)
              infra = config("docker-compose-env.yml", development)
              assert set(local["services"]) == {"backend", "frontend", "worker", "browser", "browser-egress", "cli"}
              assert set(infra["services"]) == {"postgres", "redis", "kafka"}
              assert "volumes" not in local
              for name in ("backend", "worker", "cli"):
                  local_url = local["services"][name]["environment"]["HOTKEY_DATABASE_URL"]
                  prod_url = prod["services"][name]["environment"]["HOTKEY_DATABASE_URL"]
                  assert local_url != prod_url
                  prod["services"][name]["environment"]["HOTKEY_DATABASE_URL"] = local_url
                  assert not {"postgres", "redis", "kafka"}.intersection(local["services"][name].get("depends_on", {}))
              # Compose expands x-anchors into services but does not copy the anchors via include.
              local = {key: value for key, value in local.items() if not key.startswith("x-")}
              prod = {key: value for key, value in prod.items() if not key.startswith("x-")}
              assert local == prod, "Development and production application definitions differ"
              # A canary development file must not supply missing production credentials.
              isolated = Path(directory) / "isolated"
              isolated.mkdir()
              for filename in ("docker-compose.yml", "docker-compose-prod.yml"):
                  (isolated / filename).write_text(Path(filename).read_text())
              (isolated / ".env").write_text(
                  template.replace("HOTKEY_SOURCE_CREDENTIALS={}",
                                   'HOTKEY_SOURCE_CREDENTIALS={"x":"development_canary"}')
                          .replace("HOTKEY_BROWSER_WS_URL=", "HOTKEY_BROWSER_WS_URL=ws://development-canary")
              )
              isolated_production = isolated / ".env.prod"
              isolated_production.write_text("HOTKEY_DATABASE_URL=postgresql+psycopg://fake:fake@postgres:5432/prod\n")
              isolated_config = config(str(isolated / "docker-compose-prod.yml"), isolated_production)
              isolated_env = isolated_config["services"]["backend"]["environment"]
              assert isolated_env["HOTKEY_SOURCE_CREDENTIALS"] == "{}"
              assert isolated_env["HOTKEY_BROWSER_WS_URL"] == ""
          print("Application parity, infrastructure separation, and production secret isolation passed")
          PY

      - name: Validate and build the application with isolated infrastructure
        run: |
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci config --quiet
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci build backend frontend

      - name: Start the isolated runtime
        run: docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci up --detach --wait postgres redis kafka backend frontend

      - name: Verify production page CSP nonces
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.nonces = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "script" and values.get("type", "").lower() in (
                      "", "module", "text/javascript", "application/javascript"
                  ):
                      self.nonces.append(values.get("nonce"))

          origin = "http://127.0.0.1:" + os.environ["HOTKEY_WEB_PORT"]
          failures = []
          for path in ("/events", "/monitors/new"):
              previous_nonce = None
              for request_number in (1, 2):
                  with urllib.request.urlopen(origin + path, timeout=15) as response:
                      html = response.read().decode()
                      csp = response.headers.get("Content-Security-Policy", "")
                      cache = response.headers.get("Cache-Control", "").lower()
                  match = re.search(r"'nonce-([^']+)'", csp)
                  nonce = match.group(1) if match else None
                  scripts = Scripts()
                  scripts.feed(html)
                  mismatches = sum(value != nonce or not value for value in scripts.nonces)
                  cache_private = "no-store" in cache and "s-maxage" not in cache and "public" not in cache
                  fresh = nonce is not None and nonce != previous_nonce
                  policy_strict = "'strict-dynamic'" in csp and "'unsafe-inline'" not in csp and "'unsafe-eval'" not in csp
                  valid = bool(scripts.nonces) and mismatches == 0 and cache_private and fresh and policy_strict
                  print(json.dumps({"path": path, "request": request_number, "scripts": len(scripts.nonces), "nonce_mismatches": mismatches, "private_no_store": cache_private, "fresh_nonce": fresh, "strict_policy": policy_strict, "passed": valid}))
                  if not valid:
                      failures.append(path + " request " + str(request_number))
                  previous_nonce = nonce
          if failures:
              raise SystemExit("Production CSP rendering failed: " + ", ".join(failures))
          PY

      - name: Verify dependencies, proxy, and idle Worker
        run: |
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T postgres psql -X --set ON_ERROR_STOP=on --username hotkey --dbname hotkey --tuples-only --no-align --command 'SELECT current_database()')" = "hotkey"
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T redis redis-cli ping)" = "PONG"
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T postgres psql -X --username hotkey --dbname hotkey --tuples-only --no-align --command "SELECT to_regclass('public.identity_users') IS NULL AND to_regclass('public.identity_sessions') IS NULL")" = "t"
          curl --fail --silent http://127.0.0.1:8867/api/health
          curl --fail --silent http://127.0.0.1:8867/api/ready
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/api/health
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci --profile worker up --detach --wait --wait-timeout 30 worker
          for _ in {1..15}; do
            if docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci logs --no-color worker 2>&1 | grep --fixed-strings worker_started; then
              break
            fi
            sleep 1
          done
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci logs --no-color worker 2>&1 | grep --fixed-strings worker_started
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci --profile worker stop worker
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci run --rm cli | grep Usage
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T backend id -u)" = "10001"
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T frontend id -u)" = "1001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' $(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci ps --quiet backend))" = "true"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' $(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci ps --quiet frontend))" = "true"

      - name: Verify anonymous Demo access and the write boundary
        run: |
          python3 - <<'PYTHON'
          import json
          import urllib.error
          import urllib.request

          origin = "http://127.0.0.1:3000"

          def request(path, method="GET", payload=None, csrf=None):
              headers = {}
              body = None
              if payload is not None:
                  body = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              if csrf is not None:
                  headers["X-HotKey-CSRF"] = csrf
              req = urllib.request.Request(origin + path, data=body, headers=headers, method=method)
              try:
                  response = urllib.request.urlopen(req, timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  status, response_headers, content = response.status, response.headers, response.read()
              assert "Set-Cookie" not in response_headers
              return status, response_headers, content

          assert request("/api/topics")[0] == 200
          assert request("/api/source-capabilities")[0] == 200
          for path in ("/login", "/register", "/api/identity/session", "/api/identity/workspace"):
              assert request(path)[0] == 404, path
          for path in ("/api/identity/initialize", "/api/identity/sessions"):
              assert request(path, method="POST", payload={})[0] == 404, path
          payload = {"name": "Runtime Demo topic", "match_any": ["AI"], "match_all": [], "exclude": []}
          for csrf in (None, "wrong"):
              status, _, content = request("/api/topics", method="POST", payload=payload, csrf=csrf)
              assert status == 403
              assert json.loads(content)["code"] == "csrf_invalid"
          status, headers, content = request("/api/topics", method="POST", payload=payload, csrf="1")
          assert status == 201
          topic = json.loads(content)
          status, _, content = request(headers["Location"])
          assert status == 200 and json.loads(content) == topic
          status, _, content = request("/api/topics")
          assert status == 200 and len(json.loads(content)["items"]) == 1
          with urllib.request.urlopen("http://127.0.0.1:8867/openapi.json", timeout=15) as response:
              schema = json.load(response)
          assert not any(path.startswith("/api/identity") for path in schema["paths"])
          assert not schema.get("components", {}).get("securitySchemes")
          assert not any(name.startswith("Identity") for name in schema["components"]["schemas"])
          print(json.dumps({"anonymous_reads": True, "csrf_write_boundary": True, "removed_identity": True}))
          PYTHON

      - name: Record one bounded resource snapshot
        run: docker stats --no-stream $(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci ps --quiet)

      - name: Verify the generated client against the deployed API
        env:
          HOTKEY_OPENAPI_URL: http://127.0.0.1:8867/openapi.json
        run: pnpm --dir frontend openapi:check

      - name: Print service logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci logs --no-color

      - name: Remove the isolated runtime
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci down --volumes --remove-orphans
