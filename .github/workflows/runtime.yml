name: runtime

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/runtime.yml"

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOTKEY_API_PORT: "8867"
      HOTKEY_BOOTSTRAP_TOKEN: runtime-ci-bootstrap-token-is-not-a-default
      HOTKEY_POSTGRES_PASSWORD: runtime_ci_only
      HOTKEY_WEB_PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Create an isolated crawler secret
        run: echo "HOTKEY_SEARXNG_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate and build the unique Compose stack
        run: |
          docker compose --project-name hotkey-ci config --quiet
          docker compose --project-name hotkey-ci build backend frontend

      - name: Start the isolated runtime
        run: docker compose --project-name hotkey-ci up --detach --wait postgres redis kafka backend frontend

      - name: Verify production page CSP nonces
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.nonces = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "script" and values.get("type", "").lower() in (
                      "", "module", "text/javascript", "application/javascript"
                  ):
                      self.nonces.append(values.get("nonce"))

          origin = "http://127.0.0.1:" + os.environ["HOTKEY_WEB_PORT"]
          failures = []
          for path in ("/login", "/monitors/new"):
              previous_nonce = None
              for request_number in (1, 2):
                  with urllib.request.urlopen(origin + path, timeout=15) as response:
                      html = response.read().decode()
                      csp = response.headers.get("Content-Security-Policy", "")
                      cache = response.headers.get("Cache-Control", "").lower()
                  match = re.search(r"'nonce-([^']+)'", csp)
                  nonce = match.group(1) if match else None
                  scripts = Scripts()
                  scripts.feed(html)
                  mismatches = sum(value != nonce or not value for value in scripts.nonces)
                  cache_private = "no-store" in cache and "s-maxage" not in cache and "public" not in cache
                  fresh = nonce is not None and nonce != previous_nonce
                  policy_strict = "'strict-dynamic'" in csp and "'unsafe-inline'" not in csp and "'unsafe-eval'" not in csp
                  valid = bool(scripts.nonces) and mismatches == 0 and cache_private and fresh and policy_strict
                  print(json.dumps({"path": path, "request": request_number, "scripts": len(scripts.nonces), "nonce_mismatches": mismatches, "private_no_store": cache_private, "fresh_nonce": fresh, "strict_policy": policy_strict, "passed": valid}))
                  if not valid:
                      failures.append(path + " request " + str(request_number))
                  previous_nonce = nonce
          if failures:
              raise SystemExit("Production CSP rendering failed: " + ", ".join(failures))
          PY

      - name: Verify dependencies, proxy, and idle Worker
        run: |
          test "$(docker compose --project-name hotkey-ci exec -T postgres psql -X --set ON_ERROR_STOP=on --username hotkey --dbname hotkey --tuples-only --no-align --command 'SELECT current_database()')" = "hotkey"
          test "$(docker compose --project-name hotkey-ci exec -T redis redis-cli ping)" = "PONG"
          docker compose --project-name hotkey-ci exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list
          test "$(docker compose --project-name hotkey-ci exec -T postgres psql -X --username hotkey --dbname hotkey --tuples-only --no-align --command "SELECT to_regclass('public.identity_users') IS NOT NULL AND to_regclass('public.identity_sessions') IS NOT NULL")" = "t"
          curl --fail --silent http://127.0.0.1:8867/api/health
          curl --fail --silent http://127.0.0.1:8867/api/ready
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/api/health
          docker compose --project-name hotkey-ci --profile worker up --detach --wait --wait-timeout 30 worker
          for _ in {1..15}; do
            if docker compose --project-name hotkey-ci logs --no-color worker 2>&1 | grep --fixed-strings worker_started; then
              break
            fi
            sleep 1
          done
          docker compose --project-name hotkey-ci logs --no-color worker 2>&1 | grep --fixed-strings worker_started
          docker compose --project-name hotkey-ci --profile worker stop worker
          docker compose --project-name hotkey-ci run --rm cli | grep Usage
          test "$(docker compose --project-name hotkey-ci exec -T backend id -u)" = "10001"
          test "$(docker compose --project-name hotkey-ci exec -T frontend id -u)" = "1001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' $(docker compose --project-name hotkey-ci ps --quiet backend))" = "true"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' $(docker compose --project-name hotkey-ci ps --quiet frontend))" = "true"

      - name: Verify the deployed identity session boundary
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/identity/initialize --header 'Content-Type: application/json' --header 'X-HotKey-CSRF: 1' --header 'X-HotKey-Bootstrap-Token: wrong' --data-binary '{"username":"owner","password":"runtime verification password"}')" = "403"
          curl --fail --silent --cookie-jar /tmp/hotkey-ci-cookies --request POST http://127.0.0.1:3000/api/identity/initialize --header 'Content-Type: application/json' --header 'X-HotKey-CSRF: 1' --header 'X-HotKey-Bootstrap-Token: runtime-ci-bootstrap-token-is-not-a-default' --data-binary '{"username":"owner","password":"runtime verification password"}' | grep '"username":"owner"'
          curl --fail --silent --cookie /tmp/hotkey-ci-cookies http://127.0.0.1:3000/api/identity/session | grep '"username":"owner"'
          session_token="$(awk '$6 == "hotkey_session" {print $7}' /tmp/hotkey-ci-cookies)"
          csrf_token="$(awk '$6 == "hotkey_csrf" {print $7}' /tmp/hotkey-ci-cookies)"
          test -n "$session_token"
          test -n "$csrf_token"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request DELETE --cookie /tmp/hotkey-ci-cookies http://127.0.0.1:3000/api/identity/session)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request DELETE --cookie /tmp/hotkey-ci-cookies --header "X-HotKey-CSRF: $csrf_token" http://127.0.0.1:3000/api/identity/session)" = "204"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie "hotkey_session=$session_token" http://127.0.0.1:3000/api/identity/session)" = "401"
          if docker compose --project-name hotkey-ci logs --no-color backend frontend | grep --quiet --fixed-strings --regexp='runtime verification password' --regexp='runtime-ci-bootstrap-token-is-not-a-default' --regexp="$session_token" --regexp="$csrf_token"; then exit 1; fi

      - name: Record one bounded resource snapshot
        run: docker stats --no-stream $(docker compose --project-name hotkey-ci ps --quiet)

      - name: Verify the generated client against the deployed API
        env:
          HOTKEY_OPENAPI_URL: http://127.0.0.1:8867/openapi.json
        run: pnpm --dir frontend openapi:check

      - name: Print service logs after failure
        if: failure()
        run: docker compose --project-name hotkey-ci logs --no-color

      - name: Remove the isolated runtime
        if: always()
        run: docker compose --project-name hotkey-ci down --volumes --remove-orphans
