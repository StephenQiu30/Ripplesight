name: runtime

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/runtime.yml"

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOTKEY_API_PORT: "8667"
      HOTKEY_POSTGRES_PASSWORD: runtime_ci_only
      HOTKEY_DATABASE_URL: postgresql+psycopg://hotkey:runtime_ci_only@postgres:5432/hotkey
      HOTKEY_REDIS_URL: redis://redis:6379/0
      HOTKEY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HOTKEY_WEB_PORT: "8666"
      HOTKEY_WEB_ORIGIN: http://127.0.0.1:8666
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify application parity and infrastructure separation
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          environment = {key: value for key, value in os.environ.items() if not key.startswith(("HOTKEY_", "COMPOSE_"))}
          def config(path, env_file):
              selected_environment = dict(environment, HOTKEY_COMPOSE_ENV_FILE=str(env_file))
              result = subprocess.check_output(
                  ["docker", "compose", "--project-name", "hotkey-parity", "--env-file", str(env_file), "-f", path,
                   "--profile", "*", "config", "--format", "json"], env=selected_environment, text=True
              )
              return json.loads(result)

          with tempfile.TemporaryDirectory() as directory:
              development = Path(directory) / "development.env"
              production = Path(directory) / "production.env"
              template = Path(".env.example").read_text()
              development.write_text(template)
              production.write_text(template.replace("CHANGE_ME_URL_SAFE", "production_test_only"))
              local = config("docker-compose.yml", development)
              prod = config("docker-compose-prod.yml", production)
              infra = config("docker-compose-env.yml", development)
              assert set(local["services"]) == {"backend", "frontend", "worker", "scheduler", "browser", "browser-egress", "cli"}
              assert set(infra["services"]) == {"postgres", "redis", "kafka"}
              assert "volumes" not in local
              for name, host_port in (("backend", 8667), ("frontend", 8666)):
                  ports = local["services"][name]["ports"]
                  assert len(ports) == 1
                  assert ports[0]["host_ip"] == "127.0.0.1"
                  assert int(ports[0]["published"]) == host_port
                  assert ports[0]["target"] == 8080
                  assert local["services"][name]["environment"]["HOTKEY_WEB_ORIGIN"] == "http://127.0.0.1:8666"
              assert local["services"]["backend"]["environment"]["HOTKEY_WEB_BASE_URL"] == "http://127.0.0.1:8666"
              assert local["services"]["frontend"]["environment"]["HOTKEY_API_ORIGIN"] == "http://backend:8080"
              for name in ("backend", "worker", "scheduler", "cli"):
                  local_url = local["services"][name]["environment"]["HOTKEY_DATABASE_URL"]
                  prod_url = prod["services"][name]["environment"]["HOTKEY_DATABASE_URL"]
                  assert local_url != prod_url
                  prod["services"][name]["environment"]["HOTKEY_DATABASE_URL"] = local_url
                  assert not {"postgres", "redis", "kafka"}.intersection(local["services"][name].get("depends_on", {}))
              # Compose expands x-anchors into services but does not copy the anchors via include.
              local = {key: value for key, value in local.items() if not key.startswith("x-")}
              prod = {key: value for key, value in prod.items() if not key.startswith("x-")}
              assert local == prod, "Development and production application definitions differ"
              # A canary development file must not supply missing production credentials.
              isolated = Path(directory) / "isolated"
              isolated.mkdir()
              for filename in ("docker-compose.yml", "docker-compose-prod.yml"):
                  (isolated / filename).write_text(Path(filename).read_text())
              (isolated / ".env").write_text(
                  template.replace("HOTKEY_SOURCE_CREDENTIALS={}",
                                   'HOTKEY_SOURCE_CREDENTIALS={"x":"development_canary"}')
                          .replace("HOTKEY_BROWSER_WS_URL=", "HOTKEY_BROWSER_WS_URL=ws://development-canary")
              )
              isolated_production = isolated / ".env.prod"
              isolated_production.write_text("HOTKEY_DATABASE_URL=postgresql+psycopg://fake:fake@postgres:5432/prod\n")
              isolated_config = config(str(isolated / "docker-compose-prod.yml"), isolated_production)
              isolated_env = isolated_config["services"]["backend"]["environment"]
              assert isolated_env["HOTKEY_SOURCE_CREDENTIALS"] == "{}"
              assert isolated_env["HOTKEY_BROWSER_WS_URL"] == ""
          print("Application parity, infrastructure separation, and production secret isolation passed")
          PY

      - name: Validate and build the application with isolated infrastructure
        run: |
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci config --quiet
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci build backend frontend

      - name: Start the isolated runtime
        run: docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci up --detach --wait postgres redis kafka backend frontend

      - name: Verify production welcome and login CSP nonces
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.nonces = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "script" and values.get("type", "").lower() in (
                      "", "module", "text/javascript", "application/javascript"
                  ):
                      self.nonces.append(values.get("nonce"))

          origin = "http://127.0.0.1:" + os.environ["HOTKEY_WEB_PORT"]
          failures = []
          for path in ("/", "/login"):
              previous_nonce = None
              for request_number in (1, 2):
                  with urllib.request.urlopen(origin + path, timeout=15) as response:
                      html = response.read().decode()
                      csp = response.headers.get("Content-Security-Policy", "")
                      cache = response.headers.get("Cache-Control", "").lower()
                  match = re.search(r"'nonce-([^']+)'", csp)
                  nonce = match.group(1) if match else None
                  scripts = Scripts()
                  scripts.feed(html)
                  mismatches = sum(value != nonce or not value for value in scripts.nonces)
                  cache_private = "no-store" in cache and "s-maxage" not in cache and "public" not in cache
                  fresh = nonce is not None and nonce != previous_nonce
                  policy_strict = "'strict-dynamic'" in csp and "'unsafe-inline'" not in csp and "'unsafe-eval'" not in csp
                  valid = bool(scripts.nonces) and mismatches == 0 and cache_private and fresh and policy_strict
                  print(json.dumps({"path": path, "request": request_number, "scripts": len(scripts.nonces), "nonce_mismatches": mismatches, "private_no_store": cache_private, "fresh_nonce": fresh, "strict_policy": policy_strict, "passed": valid}))
                  if not valid:
                      failures.append(path + " request " + str(request_number))
                  previous_nonce = nonce
          if failures:
              raise SystemExit("Production CSP rendering failed: " + ", ".join(failures))
          PY

      - name: Verify dependencies, proxy, and idle Worker
        run: |
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T postgres psql -X --set ON_ERROR_STOP=on --username hotkey --dbname hotkey --tuples-only --no-align --command 'SELECT current_database()')" = "hotkey"
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T redis redis-cli ping)" = "PONG"
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T postgres psql -X --username hotkey --dbname hotkey --tuples-only --no-align --command "SELECT to_regclass('public.identity_users') IS NOT NULL AND to_regclass('public.identity_sessions') IS NOT NULL")" = "t"
          curl --fail --silent http://127.0.0.1:8667/api/health
          curl --fail --silent http://127.0.0.1:8667/api/ready
          curl --fail --silent http://127.0.0.1:8666/health
          curl --fail --silent http://127.0.0.1:8666/api/health
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci --profile worker up --detach --wait --wait-timeout 30 worker
          for _ in {1..15}; do
            if docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci logs --no-color worker 2>&1 | grep --fixed-strings worker_started; then
              break
            fi
            sleep 1
          done
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci logs --no-color worker 2>&1 | grep --fixed-strings worker_started
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci --profile worker stop worker
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci run --rm cli | grep Usage
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T backend id -u)" = "10001"
          test "$(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T frontend id -u)" = "1001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' $(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci ps --quiet backend))" = "true"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' $(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci ps --quiet frontend))" = "true"

      - name: Create an isolated runtime account
        run: |
          docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci exec -T backend /srv/backend/.venv/bin/python - <<'PYTHON'
          from core.config import get_settings
          from db.session import create_db_engine, create_session_factory
          from identity.services import IdentityService

          settings = get_settings()
          engine = create_db_engine(settings)
          try:
              with create_session_factory(engine)() as session:
                  IdentityService(session, settings).create_account(
                      username="runtime.reader", password="runtime-ci-password-only-2026"
                  )
          finally:
              engine.dispose()
          PYTHON

      - name: Verify welcome, real login, private pages, and session CSRF
        run: |
          python3 - <<'PYTHON'
          import http.cookiejar
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          origin = "http://127.0.0.1:8666"
          jar = http.cookiejar.CookieJar()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, url):
                  return None
          opener = urllib.request.build_opener(NoRedirect, urllib.request.HTTPCookieProcessor(jar))

          def request(path, method="GET", payload=None, csrf=None, request_origin=None):
              headers = {}
              body = None
              if payload is not None:
                  body = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              if csrf is not None:
                  headers["X-HotKey-CSRF"] = csrf
              if request_origin is not None:
                  headers["Origin"] = request_origin
              req = urllib.request.Request(origin + path, data=body, headers=headers, method=method)
              try:
                  response = opener.open(req, timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.status, response.headers, response.read()

          assert request("/")[0] == request("/login")[0] == 200
          status, _, content = request("/sitemap.xml")
          assert status == 200
          public_paths = {
              "/", "/about", "/privacy", "/terms", "/contact", "/changelog",
              "/discover", "/leaderboard", "/reports/daily", "/reports/weekly", "/reports/monthly",
          }
          locations = [entry.text for entry in ET.fromstring(content).findall(
              "{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc"
          )]
          assert len(locations) == len(public_paths)
          assert set(locations) == {origin + path for path in public_paths}
          for path in public_paths:
              assert request(path)[0] == 200, path
          status, _, content = request("/robots.txt")
          assert status == 200 and b"Disallow: /topics" in content
          assert b"Sitemap: http://127.0.0.1:8666/sitemap.xml" in content
          assert request("/api/identity/options")[0] == 200
          assert request("/api/leaderboard/rules")[0] == 200
          for path in ("/api/topics", "/api/source-capabilities", "/api/identity/session", "/api/__exports/feed.xml"):
              status, _, content = request(path)
              assert status == 401 and json.loads(content)["code"] == "invalid_session", path
          for path in ("/events", "/monitors/new", "/workspace"):
              status, headers, _ = request(path)
              assert status == 307
              target = urllib.parse.urlsplit(headers["Location"])
              assert target.path == "/login"
              assert urllib.parse.parse_qs(target.query)["returnTo"] == [path]
          credentials = {"username": "runtime.reader", "password": "runtime-ci-password-only-2026"}
          assert request("/api/identity/sessions", "POST", credentials, "1", "http://attacker.invalid")[0] == 403
          assert request("/api/identity/sessions", "POST", credentials, "wrong", origin)[0] == 403
          status, headers, content = request("/api/identity/sessions", "POST", credentials, "1", origin)
          assert status == 200, content
          assert len(headers.get_all("Set-Cookie")) == 2
          csrf = next(cookie.value for cookie in jar if cookie.name == "hotkey_csrf")
          assert request("/api/identity/session")[0] == 200
          payload = {"name": "Runtime personal topic", "match_any": ["AI"], "match_all": [], "exclude": []}
          for invalid in (None, "wrong", "1"):
              status, _, content = request("/api/topics", "POST", payload, invalid, origin)
              assert status == 403 and json.loads(content)["code"] == "csrf_invalid"
          status, headers, content = request("/api/topics", "POST", payload, csrf, origin)
          assert status == 201, content
          topic = json.loads(content)
          assert json.loads(request(headers["Location"])[2]) == topic
          assert len(json.loads(request("/api/topics")[2])["items"]) == 1

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.nonces = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "script" and values.get("type", "").lower() in ("", "module", "text/javascript", "application/javascript"):
                      self.nonces.append(values.get("nonce"))
          for path in ("/events", "/monitors/new"):
              previous = None
              for _ in range(2):
                  status, headers, html = request(path)
                  assert status == 200, path
                  csp = headers.get("Content-Security-Policy", "")
                  nonce = re.search(r"'nonce-([^']+)'", csp).group(1)
                  scripts = Scripts()
                  scripts.feed(html.decode())
                  assert scripts.nonces and all(value == nonce for value in scripts.nonces)
                  assert nonce != previous
                  assert "no-store" in headers.get("Cache-Control", "").lower()
                  previous = nonce
          assert request("/api/identity/session", "DELETE", csrf=csrf, request_origin=origin)[0] == 204
          assert request("/api/topics")[0] == 401
          with urllib.request.urlopen("http://127.0.0.1:8667/openapi.json", timeout=15) as response:
              schema = json.load(response)
          assert "/api/identity/sessions" in schema["paths"]
          assert schema["components"]["securitySchemes"]["SessionCookie"] == {"type": "apiKey", "in": "cookie", "name": "hotkey_session"}
          assert schema["paths"]["/api/topics"]["get"]["security"]
          print(json.dumps({"public_welcome": True, "anonymous_denied": True, "password_login": True, "session_csrf": True, "private_page_nonce": True, "logout": True}))
          PYTHON

      - name: Record one bounded resource snapshot
        run: docker stats --no-stream $(docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci ps --quiet)

      - name: Verify the generated client against the deployed API
        env:
          HOTKEY_OPENAPI_URL: http://127.0.0.1:8667/openapi.json
        run: pnpm --dir frontend openapi:check

      - name: Print service logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci logs --no-color

      - name: Remove the isolated runtime
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose-env.yml --project-name hotkey-ci down --volumes --remove-orphans
