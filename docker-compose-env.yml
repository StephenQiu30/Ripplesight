# Optional infrastructure; local development reuses existing services.
# Explicit volume aliases can retain existing data when changing project names.
name: ripplesight

services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: hotkey
      POSTGRES_PASSWORD: ${HOTKEY_POSTGRES_PASSWORD:?set HOTKEY_POSTGRES_PASSWORD in the environment or root .env}
      POSTGRES_USER: hotkey
    ports:
      - 127.0.0.1:${HOTKEY_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./backend/sql/schema.sql
        target: /docker-entrypoint-initdb.d/001-schema.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotkey -d hotkey"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M

  redis:
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis:7.2.16-alpine3.21
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - 127.0.0.1:${HOTKEY_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  kafka:
    container_name: ${COMPOSE_PROJECT_NAME}-kafka
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:${HOTKEY_KAFKA_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_NODE_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 127.0.0.1:${HOTKEY_KAFKA_PORT:-19092}:19092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M

volumes:
  kafka-data:
    name: ${HOTKEY_KAFKA_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_kafka-data}
  postgres-data:
    name: ${HOTKEY_POSTGRES_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_postgres-data}
  redis-data:
    name: ${HOTKEY_REDIS_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_redis-data}
