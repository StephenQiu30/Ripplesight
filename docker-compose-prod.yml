# Apply with: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose-prod.yml ...
x-production: &production
  HOTKEY_ENVIRONMENT: production
  HOTKEY_DATABASE_URL: ${HOTKEY_DATABASE_URL:?Set a PostgreSQL psycopg URL}
  HOTKEY_BROKER_URL: ${HOTKEY_BROKER_URL:?Set an AMQP URL}
  HOTKEY_COOKIE_SECURE: "true"
  HOTKEY_ALLOWED_ORIGINS: ${HOTKEY_ALLOWED_ORIGINS:?Set a JSON array of exact HTTPS origins}
  HOTKEY_S3_ENDPOINT: ${HOTKEY_S3_ENDPOINT:-}
  HOTKEY_S3_ACCESS_KEY: ${HOTKEY_S3_ACCESS_KEY:-}
  HOTKEY_S3_SECRET_KEY: ${HOTKEY_S3_SECRET_KEY:-}
  HOTKEY_S3_BUCKET: ${HOTKEY_S3_BUCKET:-}
  HOTKEY_S3_SECURE: ${HOTKEY_S3_SECURE:-true}
  HOTKEY_SOURCE_RIGHTS_ALLOWED: ${HOTKEY_SOURCE_RIGHTS_ALLOWED:-[]}
  HOTKEY_SOURCE_PIPELINES_CONNECTED: ${HOTKEY_SOURCE_PIPELINES_CONNECTED:-[]}
  HOTKEY_EMBEDDING_BASE_URL: ${HOTKEY_EMBEDDING_BASE_URL:-}
  HOTKEY_EMBEDDING_MODEL: ${HOTKEY_EMBEDDING_MODEL:-qwen3-embedding:latest}
  HOTKEY_EMBEDDING_MODEL_DIGEST: ${HOTKEY_EMBEDDING_MODEL_DIGEST:-}
  HOTKEY_EMBEDDING_DIMENSIONS: ${HOTKEY_EMBEDDING_DIMENSIONS:-1024}
  HOTKEY_EMBEDDING_TIMEOUT_SECONDS: ${HOTKEY_EMBEDDING_TIMEOUT_SECONDS:-15}
x-runtime: &runtime
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  pids_limit: 256
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    restart: unless-stopped
  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set broker password}
    restart: unless-stopped
  migrate:
    <<: *runtime
    environment: *production
  backend:
    <<: *runtime
    environment: *production
    command: [uvicorn, main:create_app, --factory, --host, 0.0.0.0, --port, "8080", --no-access-log]
    ports: !reset []
    develop: !reset {}
  worker:
    <<: *runtime
    environment: *production
    develop: !reset {}
  scheduler:
    <<: *runtime
    environment: *production
    develop: !reset {}
  web:
    <<: *runtime
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
    build:
      target: production
    develop: !reset {}
    restart: unless-stopped
