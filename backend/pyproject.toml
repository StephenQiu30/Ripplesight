[project]
name = "ripplesight-backend"
version = "0.1.0"
description = "Ripplesight API and background services for public news reading and personal sentiment monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "confluent-kafka>=2.11,<3",
    "fastapi[standard]>=0.116,<1",
    "feedparser>=6.0,<7",
    "highspy==1.15.1",
    "httpx>=0.28,<1",
    "markdown-it-py==4.2.0",
    "minio>=7.2,<8",
    "pillow==12.3.0",
    "playwright==1.63.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pyarrow==25.0.1",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "qrcode==8.2",
    "redis>=6.2,<7",
    "scalar-fastapi>=1.4,<2",
    "sqlalchemy>=2.0,<3",
    "structlog>=25.4,<26",
    "typer>=0.16,<1",
    "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-qrcode==8.2.0.20260518",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "D", "G", "LOG", "TID252", "PLE", "PLW0127", "PLW1509", "PGH003", "PGH004",
]
# Existing missing docstrings migrate through review; validate all present docstrings.
# New/changed public interfaces still require documentation under AGENTS.md §3.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "unused-awaitable"]

[[tool.mypy.overrides]]
# Binary Kafka client has no bundled typing; application callers remain strict.
module = ["confluent_kafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Feedparser has no bundled typing; application callers remain strict.
module = ["feedparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# APScheduler 3.x has no bundled typing; scheduler application code remains strict.
module = ["apscheduler.*"]
ignore_missing_imports = true
